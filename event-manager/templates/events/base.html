<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Mini Event Manager
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        nav {
            background: #222;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1, h2 {
            margin-top: 1px;
        }

        .status-active {
            color: green;
            font-weight: bold;
        }

        .status-closed {
            color: gray;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            margin-right: 8px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            background: #333;
            color: white;
        }

        .button:hover {
            opacity: 0.85;
        }

        .button-success {
            background: green;
        }

        .button-danger {
            background: #c62828;
        }

        .button-secondary {
            background: #777;
            margin: 5px;
        }

        form p {
            margin-bottom: 15px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px;
        }

    </style>
</head>

<body>

<nav>
    <a href="{% url 'events' %}">
        Events
    </a>

    <a href="{% url 'event_create' %}">
        Create Event
    </a>
</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
