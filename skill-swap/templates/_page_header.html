<header class="site-header">
    <nav>
        <a href="{% url 'home' %}">Обзор</a>
        {% if user.is_authenticated %}
            <span>{{ user.username }}</span>
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
            <a href="{% url 'my_skills' %}">Мои предложения</a>
            <a href="{% url 'my_lesson_requests' %}">Мои запросы</a>
            <a href="{% url 'profile' user.profile.id %}">Мой профиль</a>
            <a href="{% url 'favorites' user.id %}">Избранное</a>
        {% else %}
            <a href="{% url 'accounts:login' %}">Войти</a>
            <a href="{% url 'accounts:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>
